<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a8c4"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bg2)"/>
  <text x="56" y="64" fill="#fff" font-size="44" font-family="Inter, Arial" font-weight="700">Memory Debug Decision Tree</text>
  <text x="56" y="102" fill="#9fb0c8" font-size="24" font-family="Inter, Arial">From alert to root cause without guesswork</text>

  <g font-family="Inter, Arial" font-size="22" fill="#fff">
    <rect x="70" y="170" width="390" height="100" rx="16" fill="#151d2c" stroke="#ef4f67" stroke-width="3"/>
    <text x="95" y="230">Alert: Memory / RSS is high</text>

    <rect x="540" y="170" width="430" height="100" rx="16" fill="#151d2c" stroke="#f5b53b" stroke-width="3"/>
    <text x="565" y="230">Check post-GC baseline trend</text>

    <rect x="1060" y="170" width="460" height="100" rx="16" fill="#151d2c" stroke="#f5b53b" stroke-width="3"/>
    <text x="1085" y="230">Baseline stable?</text>

    <rect x="1060" y="360" width="460" height="130" rx="16" fill="#151d2c" stroke="#24c97a" stroke-width="3"/>
    <text x="1085" y="420">Yes: likely not a leak</text>
    <text x="1085" y="456" fill="#c8d4e8">allocator reuse / warm cache / mmap</text>

    <rect x="540" y="360" width="430" height="130" rx="16" fill="#151d2c" stroke="#ef4f67" stroke-width="3"/>
    <text x="565" y="420">No: capture snapshots</text>
    <text x="565" y="456" fill="#c8d4e8">early vs later memory state</text>

    <rect x="70" y="360" width="390" height="130" rx="16" fill="#151d2c" stroke="#ef4f67" stroke-width="3"/>
    <text x="95" y="420">Diff dominators</text>
    <text x="95" y="456" fill="#c8d4e8">find retaining path</text>

    <rect x="70" y="590" width="390" height="130" rx="16" fill="#151d2c" stroke="#2f7cff" stroke-width="3"/>
    <text x="95" y="650">Map to subsystem</text>
    <text x="95" y="686" fill="#c8d4e8">cache / listener / queue / closure</text>

    <rect x="540" y="590" width="430" height="130" rx="16" fill="#151d2c" stroke="#24c97a" stroke-width="3"/>
    <text x="565" y="650">Patch lifetime bug</text>
    <text x="565" y="686" fill="#c8d4e8">evict, dispose, prune, weak refs</text>

    <rect x="1060" y="590" width="460" height="130" rx="16" fill="#151d2c" stroke="#f5b53b" stroke-width="3"/>
    <text x="1085" y="650">Re-run same workload</text>
    <text x="1085" y="686" fill="#c8d4e8">baseline stabilized?</text>

    <rect x="1060" y="810" width="460" height="120" rx="16" fill="#151d2c" stroke="#24c97a" stroke-width="3"/>
    <text x="1085" y="870">Add alerts, tests, runbook</text>
  </g>

  <g stroke="#94a8c4" stroke-width="4" marker-end="url(#arrow2)">
    <line x1="460" y1="220" x2="540" y2="220"/>
    <line x1="970" y1="220" x2="1060" y2="220"/>
    <line x1="1290" y1="270" x2="1290" y2="360"/>
    <line x1="1060" y1="425" x2="970" y2="425"/>
    <line x1="540" y1="425" x2="460" y2="425"/>
    <line x1="265" y1="490" x2="265" y2="590"/>
    <line x1="460" y1="655" x2="540" y2="655"/>
    <line x1="970" y1="655" x2="1060" y2="655"/>
    <line x1="1290" y1="720" x2="1290" y2="810"/>
  </g>

  <text x="1320" y="330" fill="#24c97a" font-size="22" font-family="Inter, Arial" font-weight="700">YES</text>
  <text x="1000" y="405" fill="#ef4f67" font-size="22" font-family="Inter, Arial" font-weight="700">NO</text>
</svg>
